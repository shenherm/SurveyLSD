name: Update work orders
on:
  schedule:
    - cron: '11 * * * *'          # every hour
  workflow_dispatch:              # manual "Run workflow" button
permissions:
  contents: write
concurrency:                      # never let two runs push at once
  group: workorders
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so we can rebase onto the latest main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Fetch Gmail attachments and rebuild workorders.json
        working-directory: tools
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WO_QUERY: ${{ secrets.WO_QUERY }}
        run: |
          python fetch_workorders.py
          mv -f workorders.json ../workorders.json
      - name: Commit if changed (resilient to main moving)
        run: |
          cp workorders.json /tmp/wo.json
          git config user.name  "workorders-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp -f /tmp/wo.json workorders.json
            if git diff --quiet -- workorders.json; then
              echo "No change to workorders.json"; exit 0
            fi
            git add workorders.json
            git commit -m "Update work orders ($(date -u +%Y-%m-%dT%H:%MZ))"
            if git push; then echo "pushed"; exit 0; fi
            echo "push rejected (attempt $i) — main moved, resyncing and retrying"
            sleep 3
          done
          echo "push still failing after retries"; exit 1
