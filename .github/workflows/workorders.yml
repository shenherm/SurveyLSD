name: Update work orders
on:
  schedule:
    - cron: '11 * * * *'          # every hour
  workflow_dispatch:            # manual "Run workflow" button
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Fetch Gmail attachments and rebuild workorders.json
        working-directory: tools
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WO_QUERY: ${{ secrets.WO_QUERY }}
        run: |
          python fetch_workorders.py
          mv -f workorders.json ../workorders.json
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- workorders.json; then
            git config user.name  "workorders-bot"
            git config user.email "actions@users.noreply.github.com"
            git add workorders.json
            git commit -m "Update work orders ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "No change to workorders.json"
          fi
